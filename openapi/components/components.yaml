---
components:
  schemas:
    BulkTransactionMetadata:
      type: object
      properties:
        upload_id:
          type: string
          description: The unique identifier for the bulk transaction upload.
          example: 2535af08-a139-4d0c-9827-1651e46dfbcf
        file_name:
          type: string
          description: The name of the file uploaded.
          example: example.csv
        transaction_count:
          type: integer
          description: The number of transactions in the file.
          example: 100
        size:
          type: integer
          description: The size of the file in bytes.
          example: 1024
        corporation_id:
          type: string
          description: The unique identifier for a corporation.
          example: 2535af08-a139-4d0c-9827-1651e46dfbcf
        created_at:
          type: number
          description: Timestamp in UTC when this bulk transaction upload was created.
          example: 1727284490
    GetWebhookResponse:
      type: object
      properties:
        id:
          type: string
          description:
            The unique identifier for this webhook. You will need this if
            you need to update or delete this webhook.
          example: 2535af08-a139-4d0c-9827-1651e46dfbcf
        api_version:
          type: string
          description:
            The version of the API for which you registered the webhook.
            This will be 'v1.0' for now. This helps to maintain backward compatibility.
            If in newer versions the event payload is changed, your webhook will keep
            receiving the payload from the original api version.
          example: v1.0
        name:
          type: string
          description: Optional name to define the purpose of the webhook.
          example: handle_existing_registrations_validation_failure
        topics:
          type: array
          items:
            type: string
            enum:
              - REGISTRATIONS.EXISTING.VALIDATION_FAILED
              - REGISTRATIONS.EXISTING.VALIDATION_SUCCEEDED
          description:
            An array of topics to listen to. When any of these topics are
            triggered, the webhook will be pinged.
        url:
          type: string
          description:
            Your webhook url that will be hit once a topic is triggered.
            Only https:// urls will work.
          example: https://bruno-simon.com/
        status:
          type: string
          enum:
            - ENABLED
            - DISABLED
          description:
            If the webhook is active or not. If a webhook id disabled it
            won't be called when a topic is triggered.
        created_at:
          type: number
          description: Timestamp in UTC when this webhook was created.
          example: 1727284490
    UpdateWebhookRequest:
      type: object
      properties:
        api_version:
          type: string
          description:
            The version of the API for which you registered the webhook.
            This helps to maintain backward compatibility. If in newer versions the
            event payload is changed, your webhook will keep receiving the payload from
            this api version. This will be 'v1.0' for now and we will come up with more
            versions and a changelog later.
        name:
          type: string
          description: Optional name to define the purpose of the webhook.
        topics:
          type: array
          items:
            type: string
            enum:
              - REGISTRATIONS.EXISTING.VALIDATION_FAILED
              - REGISTRATIONS.EXISTING.VALIDATION_SUCCEEDED
          description:
            An array of topics to listen to. When any of these topics are
            triggered, the webhook will be pinged.
        status:
          type: string
          enum:
            - ENABLED
            - DISABLED
          description:
            If the webhook is active or not. If a webhook is disabled it
            won't be called when a topic is triggered.
    CreateWebhookRequest:
      type: object
      required:
        - api_version
        - url
        - key
        - status
        - topics
      properties:
        api_version:
          type: string
          description:
            The version of the API for which you registered the webhook.
            This helps to maintain backward compatibility. If in newer versions the
            event payload is changed, your webhook will keep receiving the payload from
            this api version. This will be 'v1.0' for now and we will come up with more
            versions and a changelog later.
        name:
          type: string
          description: Optional name to define the purpose of the webhook.
        topics:
          type: array
          items:
            type: string
            enum:
              - REGISTRATIONS.EXISTING.VALIDATION_FAILED
              - REGISTRATIONS.EXISTING.VALIDATION_SUCCEEDED
          description:
            An array of topics to listen to. When any of these topics are
            triggered, the webhook will be pinged.
        url:
          type: string
          description:
            Your webhook url that will be hit once an event happens. Only
            HTTPS urls are allowed.
        key:
          type: string
          description:
            Secure string provided by the user. It will be used during HMCA
            process to keep the event payloads secure. Make sure to keep it safe as
            you will need it during validating event payloads. This key won't be returned
            back by any other endpoint.
        status:
          type: string
          enum:
            - ENABLED
            - DISABLED
          description:
            If the webhook is active or not. If a webhook is disabled it
            won't be called when a topic is triggered.
    CreateWebhookResponse:
      type: object
      properties:
        id:
          type: string
          description:
            The unique identifier for this webhook. You will need this if
            you need to update or delete this webhook.
          example: 2535af08-a139-4d0c-9827-1651e46dfbcf
        api_version:
          type: string
          description:
            The version of the API for which you registered the webhook.
            This will be 'v1.0' for now. This helps to maintain backward compatibility.
            If in newer versions the event payload is changed, your webhook will keep
            receiving the payload from the original api version.
          example: v1.0
        name:
          type: string
          description: Optional name to define the purpose of the webhook.
          example: handle_existing_registrations_validation_failure
        topics:
          type: array
          items:
            type: string
            enum:
              - REGISTRATIONS.EXISTING.VALIDATION_FAILED
              - REGISTRATIONS.EXISTING.VALIDATION_SUCCEEDED
          description:
            An array of topics to listen to. When any of these topics are
            triggered, the webhook will be pinged.
        url:
          type: string
          description:
            Your webhook url that will be hit once a topic is triggered.
            Only https:// urls will work.
          example: https://bruno-simon.com/
        key:
          type: string
          description:
            Use for signing the event payloads. All the event payloads will
            be signed using this key. Make sure to keep it safe as you will need it
            during validating event payloads.
          example: couabowugowubfvow2efgofqpifhdiubvafobafou2ee
        status:
          type: string
          enum:
            - ENABLED
            - DISABLED
          description:
            If the webhook is active or not. If a webhook id disabled it
            won't be called when a topic is triggered.
        created_at:
          type: number
          description: Timestamp in UTC when this webhook was created.
          example: 1727284490
    CreateRefundRequest:
      "$ref": "./tax-transactions.yaml#/schemas/CreateRefundRequest"
    Product:
      "$ref": "./products.yaml#/schemas/Product"
    CreateProduct:
      $ref: "./products.yaml#/schemas/CreateProduct"
    UpdateProduct:
      $ref: "./products.yaml#/schemas/UpdateProduct"
    TaxCalculationRequest:
      "$ref": "./tax-calculations.yaml#/schemas/TaxCalculationRequest"
    TaxCalculationResponse:
      "$ref": "./tax-calculations.yaml#/schemas/TaxCalculationResponse"
    AddressRequirementsResponse:
      $ref: "./address-requirements.yaml#/schemas/AddressRequirementsResponse"
    CustomsDutyCalculationRequest:
      type: object
      required:
        - corporation_id
        - invoice_currency
        - subtotal
        - origin_country
        - destination_country
        - line_items
      properties:
        corporation_id:
          type: string
          description:
            The unique identifier for the corporation to calculate an import
            duty rate for.
          example: b6d009b0-d174-463f-b030-94643c28e209
        invoice_currency:
          "$ref": "#/components/schemas/Currency"
        subtotal:
          type: number
          example: 10.99
          description: Total amount before tax, shipping, handling, and discounts.
        discount:
          type: number
          example: 0.99
          description: Total discount amount applied to the subtotal.
        shipping_and_handling:
          type: number
          example: 0
          description: Total shipping and handling charges.
        origin_country:
          "$ref": "#/components/schemas/Country"
        destination_country:
          "$ref": "#/components/schemas/Country"
        line_items:
          type: object
          required:
            - amount
            - quantity
          properties:
            items:
              description:
                Array of line items representing individual products in the
                shipment. For each line item, pass exactly one of `customs_code` or
                the `product_id`. If the `product_id` is passed, the `customs_code`
                will be fetched from the product itself.
              type: array
              items:
                type: object
                properties:
                  amount:
                    type: number
                    description:
                      Total price for the line item, including any discounts
                      and shipping and handling costs.
                  quantity:
                    type: number
                    description: Quantity of units purchased.
                  # customs_code:
                  #   "$ref": "#/components/schemas/customs_code"
                  product_id:
                    type: string
                    description:
                      The unique identifier for the product getting sold
                      in this line item.
    CreateTaxTransactionRequest:
      "$ref": "./tax-transactions.yaml#/schemas/CreateTaxTransactionRequest"
    TaxTransactionResponse:
      "$ref": "./tax-transactions.yaml#/schemas/TaxTransactionResponse"
    transaction_type:
      "$ref": "./tax-transactions.yaml#/schemas/transaction_type"
    transaction_status:
      "$ref": "./tax-transactions.yaml#/schemas/transaction_status"
    filing_frequency:
      type: string
      enum:
        - MONTHLY
        - QUARTERLY
        - SEMI_ANNUALLY
        - ANNUAL_CALENDAR_YEAR
        - FISCAL_YEAR
        - MONTHLY_ACCELERATED_PREPAY_EARLY
        - QUARTERLY_PREPAY_MONTHLY
        - ANNUAL_RECONCILIATION
        - BI_MONTHLY
        - TRI_ANNUALLY
        - QUARTERLY_FEB
        - QUARTERLY_MAR
      description: >-
        How often the business is required to submit tax returns.
        V1 registrations typically use MONTHLY, QUARTERLY, SEMI_ANNUALLY, or ANNUAL_CALENDAR_YEAR.
        V2 registrations may use additional frequencies such as ANNUAL_RECONCILIATION
        (for jurisdictions requiring a separate annual reconciliation filing alongside
        periodic returns) or region-specific variants like QUARTERLY_FEB and QUARTERLY_MAR.
    Tax_filing_status:
      type: string
      enum:
        - SCHEDULED
        - ACCRUING
        - ACTIVE
        - FILED
        - OVERDUE
      description: >-
        Current status of the filing. SCHEDULED means the filing has been created
        but the tax period has not yet started. ACCRUING means transactions are being
        collected for this period. ACTIVE means the filing is ready for review and
        submission. FILED means the return has been submitted. OVERDUE means the
        due date has passed without filing.
    Filing:
      type: object
      description: >-
        One tax return for one jurisdiction and one tax period.
        Money fields are decimals in major units of `reporting_currency`
        (for example, `1031.25` means 1,031.25). A money field is left out of
        the response when its value is zero or has not been recorded yet.
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the filing.
        corporation_id:
          type: string
          format: uuid
          description: The corporation this filing belongs to.
        form_title:
          type: string
          description: Name of the tax return form (e.g., "Sales and Use Tax Return").
        description:
          type: string
          description: Additional details about the filing, such as the filing variant or deadline type.
        jurisdiction_id:
          type: string
          description: Commenda identifier of the jurisdiction the return is filed with.
          example: "STATE_CEN_06"
        jurisdiction_name:
          type: string
          description: Human-readable jurisdiction name.
          example: "California"
        jurisdiction_type:
          type: string
          description: Type of jurisdiction the return is filed with.
          enum:
            - STATE_OR_PROVINCE
            - COUNTRY
            - TRADEBLOC
            - CITY_OR_COUNTY
        registration_tax_type_id:
          type: string
          description: Identifier of the registration tax type this filing belongs to. Can be used as a filter on List filings.
          example: "REG_STATE_CEN_06_RST"
        filing_frequency:
          "$ref": "#/components/schemas/filing_frequency"
        tax_period_start_date:
          type: string
          format: date
          description: First day of the tax period the return covers.
          example: "2026-07-01"
        tax_period_end_date:
          type: string
          format: date
          description: Last day of the tax period the return covers.
          example: "2026-09-30"
        reporting_period_start_date:
          type: string
          format: date
          description: Start of the reporting period. May differ from the tax period.
        reporting_period_end_date:
          type: string
          format: date
          description: End of the reporting period.
        filing_due_date:
          type: string
          format: date
          description: Date by which the return must be filed.
          example: "2026-10-31"
        status:
          "$ref": "#/components/schemas/Tax_filing_status"
        filed_at:
          type: string
          format: date
          description: Date the return was filed with the tax authority. Set once the filing is `FILED`.
          example: "2026-10-20"
        reporting_currency:
          type: string
          nullable: true
          description: ISO 4217 currency code that the money fields on this filing are in.
          example: "USD"
        estimated_taxable_amount:
          type: number
          description: >-
            Taxable sales computed by Commenda from the transactions in the
            period. Updated while the filing is open.
          example: 12500.00
        estimated_non_taxable_amount:
          type: number
          description: Non-taxable sales computed from the transactions in the period.
          example: 1500.50
        estimated_exempt_amount:
          type: number
          description: Exempt sales computed from the transactions in the period.
          example: 250.00
        estimated_tax_collected:
          type: number
          description: Tax collected, computed from the transactions in the period.
          example: 1031.25
        taxable_amount:
          type: number
          description: Taxable sales reported on the filed return. Recorded when the return is filed.
          example: 12480.00
        non_taxable_amount:
          type: number
          description: Non-taxable sales reported on the filed return.
          example: 1500.50
        exempt_amount:
          type: number
          description: Exempt sales reported on the filed return.
          example: 250.00
        tax_liability:
          type: number
          description: Tax due on the filed return.
          example: 1029.60
        tax_paid:
          type: number
          description: Amount paid to the tax authority for this return.
          example: 1029.60
        penalty:
          type: number
          description: Penalty assessed on this return, if any.
        interest:
          type: number
          description: Interest assessed on this return, if any.
        filing_confirmation_number:
          type: string
          description: Confirmation number issued by the tax authority when the return was filed.
          example: "0012-3456-7890"
        payment_confirmation_number:
          type: string
          description: Confirmation number issued by the tax authority for the payment.
          example: "PMT-998877"
        created_at:
          type: integer
          format: int64
          description: When the filing was created, in Unix microseconds.
          example: 1751328000000000
        contributions:
          type: array
          nullable: true
          description: >-
            Tax-return box values for EU and UK VAT filings. Only included on
            List filings when called with `extend=filing_contribution`; left
            out otherwise. An empty array means the box values have not been
            computed yet.
          items:
            "$ref": "../components/filings.yaml#/schemas/FilingContribution"
    FilingDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the filing document.
        filing_id:
          type: string
          format: uuid
          description: The filing this document belongs to.
        file_id:
          type: string
          format: uuid
          description: >-
            Identifier of the file. Call `GET /files/{file_id}` to get a
            signed download URL.
        type:
          type: string
          enum:
            - FILING_CONFIRMATION
            - PAYMENT_CONFIRMATION
            - RETURN_CONFIRMATION
          description: >-
            What the document is. `FILING_CONFIRMATION`: the tax authority's
            confirmation that the return was filed. `PAYMENT_CONFIRMATION`:
            the confirmation of payment. `RETURN_CONFIRMATION`: a copy of the
            filed return. A filing has at most one document of each type.
        created_at:
          type: integer
          format: int64
          description: When the document was attached, in Unix microseconds.
    RegistrationGet:
      $ref: "./registrations.yaml#/schemas/RegistrationGet"
    Country:
      type: string
      example: US
      description: "ISO 3166 2-letter country code. Ex: US, IN, GB."
    Currency:
      type: string
      example: USD
      description: ISO 4217 alpha-3 currency code for the transaction.
    RegistrationPost:
      $ref: "./registrations.yaml#/schemas/RegistrationPost"
    RegistrationIdPost:
      $ref: "./registrations.yaml#/schemas/RegistrationIdPost"
    NexusResponse:
      $ref: "./nexus.yaml#/schemas/NexusResponse"
    JurisdictionExposure:
      $ref: "./nexus.yaml#/schemas/JurisdictionExposure"
    NexusRule:
      $ref: "./nexus.yaml#/schemas/NexusRule"
    CalculationObject:
      $ref: "./nexus.yaml#/schemas/CalculationObject"
    CreateExemptionCertificateRequest:
      $ref: "./exemption-certificates.yaml#/schemas/CreateExemptionCertificateRequest"
    ExemptionCertificateResponse:
      $ref: "./exemption-certificates.yaml#/schemas/ExemptionCertificateResponse"
    FileInfo:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the file
        name:
          type: string
          example: example.pdf
          description: File name.
        size:
          type: number
          description: File size (bytes)
          example: 102400
        corporation_id:
          type: string
          description:
            The unique identifier for a corporation associated with this
            file.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              description: "Specific Error type. Example: CLIENT_INVALID_REQUEST_BODY."
              example: CLIENT_INVALID_REQUEST_BODY
            doc_url:
              type: string
              description:
                "A link to the docs with details about this error. Example:
                https://sales-tax-docs.commenda.io/"
              example: https://sales-tax-docs.commenda.io/
            title:
              type: string
              description:
                "A short title describing the error. Example: Missing query
                parameters."
              example: Failed to validate the request body
            detail:
              type: string
              description:
                A json string with a description on how to fix the error.
                Example {"description":"Please pass in a valid corporation_id"}
            status:
              type: number
              description:
                "The status code. It should be the same as the HTTP protocol
                status code. Example: 200"
              example: 400
            instance:
              type: string
              description: "The relative path that was hit by the user. Example: /api/v1/corporations/1"
            Errors:
              type: array
              items:
                type: object
                properties:
                  details:
                    type: string
                    description: More details on how to solve this particular error.
                  pointer:
                    type: string
                    description:
                      Relative reference to missing or invalid piece of passed
                      information.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
