    operationId: listFiles
    parameters:
      - name: corporation_id
        in: query
        description:
          The unique identifier of the corporation for which to retrieve
          data.
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: Cursor for pagination
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of items to return per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    responses:
      "200":
        description: List of files
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    files:
                      type: array
                      items:
                        "$ref": "../components/components.yaml#/components/schemas/FileInfo"
                    cursor:
                      type: string
                      description: Pagination cursor for the next set of results
                message:
                  type: string
                  example: Successfully fetched files.
