---
"/webhooks":
  post:
    summary: Create a new webhook.
    description: Register your webhook with Commenda.
    operationId: registerWebhook
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/components.yaml#/components/schemas/CreateWebhookRequest"
    responses:
      "200":
        description: Sales tax registration response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/CreateWebhookResponse"
                message:
                  type: string
                  example: Successfully registered webhook.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  get:
    summary: List all webhook.
    description: Get a list of all webhooks registered with Commenda.
    operationId: listAllWebhooks
    responses:
      "200":
        description: Sales tax registration response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    webhooks:
                      "$ref": "../components/components.yaml#/components/schemas/GetWebhookResponse"
                message:
                  type: string
                  example: Successfully fetched webhooks.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/webhooks/:id":
  post:
    summary: Update a webhook
    description: Update an existing webhook.
    operationId: updateWebhook
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/components.yaml#/components/schemas/UpdateWebhookRequest"
    responses:
      "200":
        description: Sales tax registration response
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Successfully updated webhook.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  get:
    summary: Get a webhook.
    description: Get a webhook registered with Commenda.
    operationId: getWebhook
    responses:
      "200":
        description: Sales tax registration response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/GetWebhookResponse"
                message:
                  type: string
                  example: Successfully fetched webhook.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  delete:
    summary: Delete a webhook
    description: Delete an existing webhook.
    operationId: deleteWebhook
    responses:
      "204":
        description: Sales tax registration response
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/webhooks/test/trigger/:id":
  post:
    summary: Test your webhook
    description: Trigger a test against your webhook.
    operationId: testWebhook
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              event_data:
                type: object
                description:
                  Data to inject into event.data. When the webhook will
                  be triggered the event will have this data.
    responses:
      "200":
        description: Sales tax registration response
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Successfully triggered webhook.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/products":
  post:
    summary: Add a new product.
    description: Create a new product for a corporation.
    operationId: createProduct
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/components.yaml#/components/schemas/CreateProduct"
    responses:
      "200":
        description: Create product response.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/Product"
                message:
                  type: string
                  example: Successfully created product.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  get:
    summary: Get a product by id.
    operationId: getProduct
    parameters:
      - name: corporation_id
        in: query
        description:
          The unique identifier for a corporation to filter the products
          by.
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: Cursor for pagination
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of items to return per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    responses:
      "200":
        description: Fetch a product response.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    products:
                      type: array
                      items:
                        "$ref": "../components/components.yaml#/components/schemas/Product"
                    cursor:
                      type: string
                message:
                  type: string
                  example: Successfully fetched products.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/products/bulk_upload/csv":
  post:
    summary: Bulk upload products
    description: Submit a CSV file of products for processing
    operationId: submitBulkProducts
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - file_id
            properties:
              file_id:
                type: string
                description: The ID of a previously uploaded CSV file via the `/files` endpoint.
              corporation_id:
                type: string
                description: The unique identifier for a corporation to associate with these products.
    responses:
      "200":
        description: Successful product import job creation
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    job:
                      "$ref": "../components/job.yaml#/schemas/Job"
                message:
                  type: string
                  example: Successfully started product import job.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/products/:id":
  post:
    summary: Update a product.
    description: Update an existing product by id.
    operationId: updateProduct
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/components.yaml#/components/schemas/UpdateProduct"
    responses:
      "200":
        description: Create product response.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Successfully updated product.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  get:
    summary: Get a product by id.
    operationId: getProductById
    responses:
      "200":
        description: Fetch a product response.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/Product"
                message:
                  type: string
                  example: Successfully fetched product.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  delete:
    summary: Delete a product by id.
    operationId: deleteProduct
    responses:
      "204":
        description: Delete a product response.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/products/{id}/customs-code":
  post:
    summary: Add or update a customs code for a product.
    description: Manage customs code for each product by jurisdiction.
    operationId: updateProductCustomsCode
    parameters:
      - in: path
        required: true
        name: id
        schema:
          type: string
        description: The unique identifier of the product to update.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - country
              - customs_code
            properties:
              country:
                "$ref": "../components/components.yaml#/components/schemas/Country"
              # customs_code:
              #   "$ref": "../components/components.yaml#/components/schemas/customs_code"
    responses:
      "200":
        description: Set product customs code response.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Successfully set product customs code.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  delete:
    summary: Delete a customs code for a product.
    operationId: deleteProductCustomsCode
    parameters:
      - in: path
        required: true
        name: id
        schema:
          type: string
        description: The unique identifier of the product to update.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - country
            properties:
              country:
                description:
                  ISO 3166 2-letter country code representing the country
                  to remove the country code for.
                "$ref": "../components/components.yaml#/components/schemas/Country"
    responses:
      "204":
        description: Deleted customs code for product.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/corporations":
  post:
    summary: Add a new corporation.
    description: Create a new corporation for a sales tax partner.
    operationId: createCorporation
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/corporations.yaml#/schemas/CreateCorporation"
    responses:
      "200":
        description: Sales tax registration response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/corporations.yaml#/schemas/Corporation"
                message:
                  type: string
                  example: Successfully created corporation.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  get:
    summary: Get all corporations.
    description: Get all corporations associated with a sales tax partner.
    operationId: getCorporations
    parameters:
      - name: cursor
        in: query
        description: Cursor for pagination
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of items to return per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    responses:
      "200":
        description: Get all corporations response.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  required:
                    - corporations
                  properties:
                    corporations:
                      type: array
                      items:
                        "$ref": "../components/corporations.yaml#/schemas/Corporation"
                    cursor:
                      type: string
                message:
                  type: string
                  example: Successfully fetched corporations.
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/corporations/{id}":
  get:
    summary: Get corporation.
    description: Get a corporation by id.
    operationId: getCorporation
    parameters:
      - in: path
        required: true
        name: id
        schema:
          type: string
        description: The unique identifier of the corporation to fetch.
    responses:
      "200":
        description: Get one corporation response.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/corporations.yaml#/schemas/Corporation"
                message:
                  type: string
                  example: Successfully fetched corporation.
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  post:
    summary: Update a corporation.
    description: Update details for a corporation.
    operationId: updateCorporation
    parameters:
      - in: path
        required: true
        name: id
        schema:
          type: string
        description: The unique identifier of the corporation to update.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/corporations.yaml#/schemas/UpdateCorporation"
    responses:
      "200":
        description: Update one corporation response.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Successfully updated corporation.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  delete:
    summary: Delete corporation.
    description: Delete a corporation by id.
    operationId: deleteCorporation
    parameters:
      - in: path
        required: true
        name: id
        schema:
          type: string
        description: The unique identifier of the corporation to delete.
    responses:
      "204":
        description: Delete one corporation response.
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/registrations":
  post:
    summary: Create a registration
    description: Create a new sales tax registration using a registration_content_id obtained from the content/registration-input-options endpoint.
    operationId: createRegistration
    tags:
      - Registrations
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/components.yaml#/components/schemas/RegistrationPost"
    responses:
      "201":
        description: Registration created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/RegistrationGet"
                message:
                  type: string
                  example: Successfully created registration.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/registrations/list":
  post:
    summary: List registrations
    description: List all registrations for a corporation with optional filters.
    operationId: listRegistrations
    tags:
      - Registrations
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/registrations.yaml#/schemas/ListRegistrationsRequest"
    responses:
      "200":
        description: Registrations retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    registrations:
                      type: array
                      items:
                        "$ref": "../components/components.yaml#/components/schemas/RegistrationGet"
                message:
                  type: string
                  example: Successfully fetched registrations.
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/registrations/{registration_id}":
  get:
    summary: Get a registration
    description: Retrieve a single registration by its ID.
    operationId: getRegistration
    tags:
      - Registrations
    parameters:
      - in: path
        required: true
        name: registration_id
        schema:
          type: string
          format: uuid
        description: The unique identifier of the registration.
    responses:
      "200":
        description: Registration retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/RegistrationGet"
                message:
                  type: string
                  example: Successfully fetched registration.
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  post:
    summary: Update a registration
    description: Update an existing registration with new details such as tax types, frequency, or credentials.
    operationId: updateRegistration
    tags:
      - Registrations
    parameters:
      - in: path
        required: true
        name: registration_id
        schema:
          type: string
          format: uuid
        description: The unique identifier of the registration to update.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/components.yaml#/components/schemas/RegistrationIdPost"
    responses:
      "200":
        description: Registration updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/RegistrationGet"
                message:
                  type: string
                  example: Successfully updated registration.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  delete:
    summary: Delete a registration
    description: Delete a registration. Only registrations with validation_status of PENDING, INVALID, or VALIDATION_IN_PROGRESS can be deleted. VALID registrations cannot be deleted - use close or archive instead.
    operationId: deleteRegistration
    tags:
      - Registrations
    parameters:
      - in: path
        required: true
        name: registration_id
        schema:
          type: string
          format: uuid
        description: The unique identifier of the registration to delete.
    responses:
      "204":
        description: Registration deleted successfully
      "400":
        description: Bad request - cannot delete VALID registrations
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
      "404":
        description: Registration not found
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/registrations/{registration_id}/request-validation":
  post:
    summary: Request validation
    description: Submit a registration for validation by the Commenda team. Ensure all required fields (tax_registration_id, frequency, credentials) are set before calling this endpoint.
    operationId: requestRegistrationValidation
    tags:
      - Registrations
    parameters:
      - in: path
        required: true
        name: registration_id
        schema:
          type: string
          format: uuid
        description: The unique identifier of the registration to validate.
    responses:
      "200":
        description: Validation request submitted
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/RegistrationGet"
                message:
                  type: string
                  example: Successfully started validation process.
      "400":
        description: Bad request - missing required fields
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/registrations/{registration_id}/archive":
  post:
    summary: Archive a registration
    description: Archive a registration to stop tax calculations and hide from default list views. Archived registrations are completely excluded from tax processing. Use include_archived=true when listing to see archived registrations.
    operationId: archiveRegistration
    tags:
      - Registrations
    parameters:
      - in: path
        required: true
        name: registration_id
        schema:
          type: string
          format: uuid
        description: The unique identifier of the registration to archive.
    responses:
      "200":
        description: Registration archived successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/RegistrationGet"
                message:
                  type: string
                  example: Successfully archived registration.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/registrations/{registration_id}/close":
  post:
    summary: Close a registration
    description: Close a registration when you stop selling in a jurisdiction. The registration remains active for tax calculations within its date range (effective_start_date to effective_end_date). Use this when you have historical obligations to preserve.
    operationId: closeRegistration
    tags:
      - Registrations
    parameters:
      - in: path
        required: true
        name: registration_id
        schema:
          type: string
          format: uuid
        description: The unique identifier of the registration to close.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/registrations.yaml#/schemas/CloseRegistrationRequest"
    responses:
      "200":
        description: Registration closed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/RegistrationGet"
                message:
                  type: string
                  example: Successfully closed registration.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/registrations/content/available-jurisdictions":
  post:
    summary: List available jurisdictions
    description: Discover jurisdictions where you can create registrations. Use filters to narrow down by country, state, or tax type. Results are paginated using cursor-based pagination.
    operationId: listAvailableJurisdictions
    tags:
      - Registration Content
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/registrations.yaml#/schemas/JurisdictionsRequest"
    responses:
      "200":
        description: Jurisdictions retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/registrations.yaml#/schemas/JurisdictionsResponse"
                message:
                  type: string
                  example: Successfully fetched jurisdictions.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/registrations/content/registration-input-options":
  post:
    summary: Get registration options
    description: Get available tax types, frequencies, and registration_content_ids for specific jurisdictions. The registration_content_id is required when creating a registration.
    operationId: getRegistrationInputOptions
    tags:
      - Registration Content
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/registrations.yaml#/schemas/OptionsRequest"
    responses:
      "200":
        description: Options retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/registrations.yaml#/schemas/OptionsResponse"
                message:
                  type: string
                  example: Successfully fetched registration options.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/registrations/content/portal-fields":
  post:
    summary: Get portal credential fields
    description: Get the credential fields required for a specific registration content. These fields define what information you need to collect for automated tax filing.
    operationId: getPortalFields
    tags:
      - Registration Content
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/registrations.yaml#/schemas/PortalFieldsRequest"
    responses:
      "200":
        description: Portal fields retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/registrations.yaml#/schemas/PortalFieldsResponse"
                message:
                  type: string
                  example: Successfully fetched portal fields.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/calculate":
  post:
    summary: Calculate sales tax for a transaction
    operationId: calculateSalesTax
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/components.yaml#/components/schemas/TaxCalculationRequest"
    responses:
      "200":
        description: Successful tax calculation
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/TaxCalculationResponse"
                message:
                  type: string
                  example: Successfully calculated tax.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/calculate-customs-duty":
  post:
    summary: Calculate customs duty for a transaction
    operationId: calculateCustomsDuty
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/components.yaml#/components/schemas/CustomsDutyCalculationRequest"
    responses:
      "200":
        description: Successful customs duty calculation
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    customs_rate:
                      type: number
                      description:
                        Numeric value representing the customs duty rate
                        as a percentage (e.g., 6.25 for 6.25%).
                      example: 10.25
                    customs_duty_amount:
                      type: number
                      example: 1.03
                      description:
                        Numeric value representing the total amount of
                        sales tax to be remitted for this particular line item.
                    customs_duty_currency:
                      "$ref": "../components/components.yaml#/components/schemas/Currency"
                      description:
                        ISO 4217 alpha-3 currency code for the customs
                        duty amount.
                message:
                  type: string
                  example: Successfully calculated tax.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/address-requirements":
  get:
    summary: Get address requirements for a country
    description: Returns the minimum address field requirements for a given country. Use this to determine which address fields are required, optional, or ignored when submitting addresses for tax calculations and transactions.
    operationId: getAddressRequirements
    parameters:
      - name: country
        in: query
        description: A valid 2-letter ISO 3166-1 alpha-2 country code (e.g., US, CA, GB).
        required: true
        schema:
          type: string
          example: US
    responses:
      "200":
        description: Address requirements for the specified country
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/AddressRequirementsResponse"
                message:
                  type: string
                  example: Successfully retrieved address requirements.
      "400":
        description: Bad request — missing or invalid country parameter
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
      "404":
        description: No address requirements found for the specified country
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/transactions":
  post:
    summary: Create a transaction
    description: Submit a completed transaction for processing and filing
    operationId: submitTransaction
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/components.yaml#/components/schemas/CreateTaxTransactionRequest"
    responses:
      "200":
        description: Transaction creation response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/TaxTransactionResponse"
                message:
                  type: string
                  example: Successfully created transaction.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  get:
    summary: List transactions
    description: List all transactions that match this query
    operationId: listTransactions
    parameters:
      - name: corporation_id
        in: query
        description:
          The unique identifier of the corporation for which to retrieve
          data.
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: Cursor for pagination
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of items to return per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: type
        in: query
        description: Filter by a single transaction type. Superseded by `types` if both are provided.
        required: false
        schema:
          "$ref": "../components/tax-transactions.yaml#/schemas/transaction_type"
      - name: types
        in: query
        description: |-
          Filter by one or more transaction types. Takes priority over `type` when both are provided.
          If neither `types` nor `type` is specified, defaults to `[SALE, REFUND, RETURN]` — PURCHASE and PURCHASE_REFUND are excluded unless explicitly requested.
        required: false
        schema:
          type: array
          items:
            "$ref": "../components/tax-transactions.yaml#/schemas/transaction_type"
    responses:
      "200":
        description: List of transactions
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    transactions:
                      type: array
                      items:
                        "$ref": "../components/components.yaml#/components/schemas/TaxTransactionResponse"
                    cursor:
                      type: string
                      description: Pagination cursor for the next set of results
                message:
                  type: string
                  example: Successfully fetched transactions.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/transactions/{id}":
  get:
    summary: Get one transaction
    description: Retrieve one transaction by its identifier
    operationId: getTransaction
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: The unique identifier of the transaction to fetch.
    responses:
      "200":
        description: Transaction fetch response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/TaxTransactionResponse"
                message:
                  type: string
                  example: Successfully fetched transaction.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
      "404":
        description: Transaction not found
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  delete:
    summary: Delete a transaction
    description: Deletes a transaction by its identifier
    operationId: deleteTransaction
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: The unique identifier of the transaction to delete.
    responses:
      "204":
        description: Transaction successfully deleted
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
      "404":
        description: Transaction not found
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/transactions/refund-transactions/{parent-transaction-id}":
  post:
    summary: Create a return transaction
    description: |-
      Create a refund transaction linked to an existing invoice. The parent transaction can be a SALE or PURCHASE.
      When the parent is a SALE, the refund type is RETURN. When the parent is a PURCHASE, the refund type is automatically set to PURCHASE_REFUND.
      The resulting transaction will be properly linked to the original transaction.
    operationId: refundTransaction
    parameters:
      - in: path
        name: parent-transaction-id
        required: true
        schema:
          type: string
        description: The unique identifier of the SALE or PURCHASE transaction to generate a return for.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/components.yaml#/components/schemas/CreateRefundRequest"
    responses:
      "200":
        description: Transaction creation response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The unique identifier for the refund transaction.
                      example: 2535af08-a139-4d0c-9827-1651e46dfbcf
                message:
                  type: string
                  example: Successfully created refund transaction.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/transactions/bulk":
  post:
    summary: Bulk submit transactions
    description: |-
      Submit a file of completed transactions for processing.
      The CSV file must include required fields for SALE, RETURN, and PURCHASE transactions.
      For RETURN and PURCHASE transactions, all line items must have negative total amounts. RETURN transactions should include parent_invoice_id when available.
    operationId: submitBulkTransactions
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
                description: The CSV file to upload.
              corporation_id:
                type: string
                description:
                  The unique identifier for a corporation associated with
                  this file.
    responses:
      "200":
        description: Transaction creation response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/BulkTransactionMetadata"
                message:
                  type: string
                  example: Successfully uploaded transactions.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/nexus":
  get:
    summary: Get registration threshold exposure
    description: >-
      Get registration threshold exposure for a corporation. By default, returns US-state-level data.
      Pass `v2=true` to get global jurisdiction-level data covering US, Canada, UK, and EU jurisdictions,
      including support for multiple exposure rules per jurisdiction (for example, EU Union OSS, Non-Union OSS, and IOSS).
    operationId: getNexusDetails
    parameters:
      - name: corporation_id
        in: query
        description: The unique identifier for the corporation to retrieve registration threshold data for.
        required: true
        schema:
          type: string
      - name: v2
        in: query
        description: >-
          Set to `true` to use the global registration threshold engine. When enabled, the response
          uses a `jurisdictions` array with expanded fields including `jurisdiction_id`, `exposure_type`,
          `exposure_rule_id`, `subdivision`, and `currency`. When omitted or `false`,
          the legacy response format with a `states` array is returned.
        required: false
        schema:
          type: string
          enum:
            - "true"
            - "false"
    responses:
      "200":
        description: Registration threshold exposure data
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Default response
                  description: Returned when `v2` is not set or `false`.
                  properties:
                    data:
                      "$ref": "../components/components.yaml#/components/schemas/NexusResponse"
                    message:
                      type: string
                      example: Successfully fetched nexus.
                - type: object
                  title: V2 response
                  description: Returned when `v2=true`.
                  properties:
                    data:
                      "$ref": "../components/components.yaml#/components/schemas/NexusV2Response"
                    message:
                      type: string
                      example: Successfully fetched nexus.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/exposure/sync":
  post:
    summary: Sync registration threshold exposure
    description: >-
      Trigger an on-demand recompute of registration threshold exposure for a corporation.
      The exposure engine evaluates the corporation's transactions against jurisdiction-level
      exposure rules and updates the cached breached set used by `GET /nexus?v2=true`.


      As part of every successful run, the engine emits an `INDIRECT_TAX.EXPOSURE.COMPUTED`
      webhook containing the corporation's full current set of exposed jurisdictions
      (see [Topics and Events](/engine/indirect-tax/webhooks/event)).
      Use this endpoint when you need fresh exposure data without waiting for the
      daily background recompute — for example, immediately after ingesting a backfill
      of historical transactions, or after a registration is created or archived.
    operationId: syncExposure
    parameters:
      - name: corporation_id
        in: query
        description: The unique identifier for the corporation to recompute exposure for.
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Exposure recomputed successfully. The `INDIRECT_TAX.EXPOSURE.COMPUTED` webhook has been dispatched to any subscribers.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Exposure engine ran; IndirectTaxExposureComputed webhook dispatched.
      "400":
        description: Missing or invalid `corporation_id`.
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
      "401":
        description: Caller is not authorized to access the corporation.
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
      "500":
        description: Exposure engine failed to run.
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/filings":
  get:
    summary: List filings
    description: >-
      List state and local sales tax filings for a corporation, filtered by query.
      Pass `v2=true` to use the V2 filings path, which supports additional
      filters (such as `registration_tax_type_id`, `jurisdiction_ids`,
      `filing_statuses`, `filing_frequencies`, `from_due_date`, and
      `to_due_date`) and opt-in expansions via the `extend` query parameter.
    operationId: listFilings
    parameters:
      - name: corporation_id
        in: query
        description:
          The unique identifier of the corporation for which to retrieve
          data.
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: Cursor for pagination
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of items to return per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: v2
        in: query
        description: >-
          Set to `true` to use the V2 filings path, which returns V2 content
          metadata (such as `registration_tax_type_id`, `jurisdiction_name`,
          `jurisdiction_type`, and `filing_content_id`) and enables the
          additional filters and `extend` parameter documented below. When
          omitted or `false`, the legacy filings response is returned.
        required: false
        schema:
          type: string
          enum:
            - "true"
            - "false"
      - name: extend
        in: query
        description: >-
          Opt-in expansion for the V2 path (requires `v2=true`). Comma-separated
          list of expansion keys. The only supported value today is
          `filing_contribution`, which inlines the computed tax-return box
          contributions on each filing via a `contributions` array. When the
          parameter is omitted, the `contributions` field is not included in
          the response. Unknown values return a `400`.
        required: false
        schema:
          type: string
          example: "filing_contribution"
      - name: from_due_date
        in: query
        description: >-
          V2 path only (`v2=true`). ISO 8601 date string. Returns only filings
          whose due date is on or after this value.
        required: false
        schema:
          type: string
          format: date
      - name: to_due_date
        in: query
        description: >-
          V2 path only (`v2=true`). ISO 8601 date string. Returns only filings
          whose due date is on or before this value.
        required: false
        schema:
          type: string
          format: date
      - name: registration_tax_type_id
        in: query
        description: >-
          V2 path only (`v2=true`). Filter by V2 registration tax type content
          identifier (e.g., `REG_STATE_CEN_06_RST`).
        required: false
        schema:
          type: string
      - name: jurisdiction_ids
        in: query
        description: >-
          V2 path only (`v2=true`). Comma-separated list of Commenda
          jurisdiction identifiers to filter by. Maximum 100 values.
        required: false
        schema:
          type: string
          example: "COUNTRY_DE_3018,STATE_CEN_06"
      - name: filing_statuses
        in: query
        description: >-
          V2 path only (`v2=true`). Comma-separated list of filing statuses to
          filter by. Maximum 100 values.
        required: false
        schema:
          type: string
      - name: filing_frequencies
        in: query
        description: >-
          V2 path only (`v2=true`). Comma-separated list of filing frequencies
          to filter by. Maximum 100 values.
        required: false
        schema:
          type: string
    responses:
      "200":
        description: Filing info for all states
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    filings:
                      type: array
                      items:
                        "$ref": "../components/components.yaml#/components/schemas/FilingsForGetAll"
                    cursor:
                      type: string
                      description: Pagination cursor for the next set of results
                message:
                  type: string
                  example: Successfully fetched filings.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/filings/{id}":
  get:
    summary: Get one filing
    description: Retrieve one filing by its id
    operationId: getFiling
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: The unique identifier of the transaction to fetch.
    responses:
      "200":
        description: Transaction fetch response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/components.yaml#/components/schemas/FilingsGet"
                message:
                  type: string
                  example: Successfully fetched filing.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
      "404":
        description: Filing not found
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/filings/{id}/contributions":
  get:
    summary: List filing contributions
    description: >-
      Retrieve the computed tax box values (contributions) for a specific filing.
      Each contribution represents a value that maps to a box on a tax return form,
      such as taxable sales or tax due. Contributions are ordered by box order, then
      by jurisdiction for multi-jurisdiction filings (e.g., EU OSS/IOSS).
    operationId: listFilingContributions
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier of the filing to retrieve contributions for.
    responses:
      "200":
        description: Filing contributions retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/filings.yaml#/schemas/FilingContributionsResponse"
                message:
                  type: string
                  example: Successfully fetched filing contributions.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
      "404":
        description: Filing not found
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/filings/liability-report":
  post:
    summary: Get liability report
    description: >-
      Returns per-filing liability snapshots for a list of filing IDs (max
      100). Each entry's `breakdown` object is populated for US and Canadian
      filings, where liability values live on the filing row itself, and
      `null` for VAT filings (UK and EU country VAT, Union OSS, Non-Union
      OSS, IOSS) — fetch the box-level VAT detail for those via
      `POST /filings/contributions`.
    operationId: getLiabilityReport
    tags:
      - Filings
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/filings.yaml#/schemas/GetLiabilityReportRequest"
    responses:
      "200":
        description: Liability report built successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/filings.yaml#/schemas/GetLiabilityReportResponse"
                message:
                  type: string
                  example: Successfully built liability report.
      "400":
        description: Bad request — invalid body or filing not found
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
      "403":
        description: Caller is not authorized to access one or more filings
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/filings/contributions":
  post:
    summary: Get filing contributions for a batch of filings
    description: >-
      Multi-filing analog of `GET /filings/{id}/contributions`. Returns
      per-filing contribution boxes for a list of filing IDs (max 100). Each
      entry's `contributions` array is non-null for VAT filings (UK/EU
      country VAT and OSS/IOSS variants) — possibly empty if the engine
      has not computed boxes yet — and `null` for US and Canadian filings
      whose liability lives on the filing row itself.
    operationId: getFilingContributionsBatch
    tags:
      - Filings
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/filings.yaml#/schemas/GetFilingContributionsBatchRequest"
    responses:
      "200":
        description: Filing contributions retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/filings.yaml#/schemas/GetFilingContributionsBatchResponse"
                message:
                  type: string
                  example: Successfully fetched filing contributions.
      "400":
        description: Bad request — invalid body or filing not found
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
      "403":
        description: Caller is not authorized to access one or more filings
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/filings/liability-report/export":
  post:
    summary: Export liability report as zipped CSVs
    description: >-
      Queues an asynchronous export job that produces one CSV per filing,
      bundles them into a zip, uploads the zip to storage, and emails a
      signed download link to `delivery_recipients` when complete. All
      filings in a single request must belong to the same corporation
      (max 100 filings). Poll job status via the jobs endpoint, filtering
      by `entity=FILING` and
      `operation=EXPORT_INDIRECT_TAX_FILINGS_LIABILITY_REPORT`.
    operationId: exportLiabilityReport
    tags:
      - Filings
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/filings.yaml#/schemas/ExportLiabilityReportRequest"
    responses:
      "200":
        description: Export job queued successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  "$ref": "../components/filings.yaml#/schemas/ExportLiabilityReportResponse"
                message:
                  type: string
                  example: Successfully queued liability report export.
      "400":
        description: >-
          Bad request — invalid body, filing not found, or filings span
          multiple corporations
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
      "403":
        description: Caller is not authorized to access one or more filings
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
"/customers":
  post:
    summary: Create a customer
    description:
      Create a customer to track their exemption certificates and default
      values for their addresses.
    operationId: createCustomer
    requestBody:
      required: true
