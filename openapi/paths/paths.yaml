    responses:
      "200":
        description: Detailed information about a specific customer
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "../components/customers.yaml#/schemas/CustomerExtended"
                message:
                  type: string
                  example: Successfully fetched customer.
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              "$ref": "../components/components.yaml#/components/schemas/Error"
  post:
    summary: Update a customer
    description: Update a customer, including their addresses and exemption certificates.
    operationId: updateCustomer
    requestBody:
      content:
        application/json:
          schema:
            "$ref": "../components/customers.yaml#/schemas/CustomerUpdate"
